services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in deploy/.env.production}/api/v1
    restart: unless-stopped
    expose: ["80"]
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-go
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env.production}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in deploy/.env.production}
      PROCTORING_URL: http://python-proctoring:8000
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
      python-proctoring:
        condition: service_healthy
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "/hnu-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  python-proctoring:
    build: ./ai-proctoring-python
    restart: unless-stopped
    expose: ["8000"]
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
