name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build root and /site/ frontend artifacts
        working-directory: frontend
        env:
          VITE_API_URL: ''
        run: |
          rm -rf ../public dist
          VITE_BASE_PATH=/HNU-TEST-/ npm run build
          mkdir -p ../public/assets
          cp dist/index.html ../public/index.html
          cp -a dist/assets/. ../public/assets/
          rm -rf dist
          VITE_BASE_PATH=/HNU-TEST-/site/ npm run build
          mkdir -p ../public/site
          cp -a dist/. ../public/site/
          touch ../public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
